name: Build and Deploy .NET 9.0
run-name: Build and Deploy .NET 9.0

on:
  pull_request:
    branches: ["develop"]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      build:
        description: "Build and deploy"
        required: true
        default: "true"

env:
  PUBLISH_OUTPUT_PATH: C:\tmp\kivio_ecommerce_binaries
  PUBLISH_COMPRESSED_FILE: binaries.zst

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Switch to develop branch
        run: |
          git fetch origin
          git checkout develop
          git pull origin develop

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Init Scripts
        run: powershell -ExecutionPolicy Bypass -File .\init.ps1

      - name: Remove BeforeBuild from sln
        run: dotnet sln remove .\BeforeBuild\BeforeBuild.csproj

      - name: Restore
        run: dotnet restore KivioEcommerce.sln

      - name: Build
        run: dotnet build KivioEcommerce.sln --no-restore

      - name: Publish
        env:
          PUBLISH_PROJECT_PATH: ${{ vars.KIVIO_ECOMMERCE_PUBLISH_PROJECT_PATH_BASE }}
        run: dotnet publish "${{ vars.KIVIO_ECOMMERCE_PUBLISH_PROJECT_PATH_BASE }}" -c Release -o "${{ env.PUBLISH_OUTPUT_PATH }}"

      - name: Instalar Zstandard en Windows
        run: |
          choco install zstandard -y

      - name: Comprimir binarios con Zstandard
        run: |
          zstd -r -o ${{ env.PUBLISH_COMPRESSED_FILE }} "${{ env.PUBLISH_OUTPUT_PATH }}"

      - name: Verificar existencia del zip
        run: dir

      - name: Subir artefacto zst para transferencia
        uses: actions/upload-artifact@v3
        with:
          name: publish-zst
          path: ${{ env.PUBLISH_COMPRESSED_FILE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar artefacto zst
        uses: actions/download-artifact@v3
        with:
          name: publish-zst

      - name: Configurar el agente SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KIVIO_ECOMMERCE_BASE_SECRET_KEY }}

      - name: Transferir zst al servidor remoto usando rsync
        env:
          SSH_USER: ${{ secrets.KIVIO_ECOMMERCE_BASE_USER }}
          EC2_HOST: ${{ secrets.KIVIO_ECOMMERCE_BASE_HOST }}
          BINARIES_PATH: ${{ vars.KIVIO_ECOMMERCE_BINARIES_PATH_BASE }}
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./${{env.PUBLISH_COMPRESSED_FILE}} ${{ secrets.KIVIO_ECOMMERCE_BASE_USER }}@${{ secrets.KIVIO_ECOMMERCE_BASE_HOST }}:${{ vars.KIVIO_ECOMMERCE_BINARIES_PATH_BASE }}
